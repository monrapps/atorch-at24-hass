name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tests/requirements-monthly-estimate.txt
      - run: python tests/test_parser.py
      - run: python -m unittest discover -s tests -p 'test_monthly_estimate.py' -v
      - run: python -m unittest discover -s tests -p 'test_historical_projections.py' -v
