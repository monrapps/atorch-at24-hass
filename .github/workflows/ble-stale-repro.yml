name: BLE stale-data characterization

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ble-stale-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tests/requirements-ble-stale.txt
      - run: python tests/test_parser.py
      - run: python -W error tests/test_ble_stale.py -v
      - run: python tests/test_ble_stale.py --trace
